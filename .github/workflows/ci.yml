name: Python checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Python files
        run: |
          python -m py_compile app.py train_model.py model/train_pretrained_model.py migrate_database.py
      - name: Check repository hygiene
        run: |
          test ! -f .env
          test ! -d instance
